<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draft Editor</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <div class="controls-top">
      <button id="theme-toggle">Dark mode</button>
    </div>

    <div class="editor-container">
      <label for="note-text">Your Draft:</label>
      <textarea id="note-text" rows="8" placeholder="Start typing..."></textarea>
      
      <div class="stats">
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>
      </div>

      <button id="clear-btn">Clear Note</button>
    </div>
  </main>
</body>
</html>
